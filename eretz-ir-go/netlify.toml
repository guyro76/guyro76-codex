# פריסת ארץ-עיר GO! ל-Netlify.
#
# ב-Netlify האתר יושב בשורש הדומיין, ולכן הבנייה כאן היא `npm run build`
# בלי BASE_PATH (בניגוד ל-GitHub Pages, ששם האתר יושב בתת-נתיב).
#
# בממשק של Netlify צריך להגדיר Base directory = eretz-ir-go, ואז הקובץ
# הזה נקרא אוטומטית ואין מה להגדיר ידנית.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# אפליקציית עמוד יחיד: כל נתיב מוגש מ-index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ה-Service Worker וה-manifest חייבים להיטען טריים, אחרת המשתמש
# נתקע על גרסה ישנה של המשחק גם אחרי שפרסמנו עדכון.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# קובצי ה-assets נושאים גיבוב בשם, ולכן אפשר לשמור אותם לנצח
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===== כותרות אבטחה =====
# ה-CSP נועל את המשחק למקורות שלו בלבד ולוויקיפדיה. גם אם חבילה
# כלשהי בעץ התלויות תיפרץ מתישהו, הדפדפן לא ייתן לה לשלוח את
# התשובות של הילדים לשום מקום אחר.
# Permissions-Policy הופך את ההבטחה "בלי מצלמה ובלי מיקום" מהצהרה
# באפיון לחסימה שהדפדפן אוכף.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org https://api.openverse.org; font-src 'self'; connect-src 'self' https://he.wikipedia.org https://api.openverse.org https://lh3.googleusercontent.com https://ppucndvetyzteyhwrarh.supabase.co wss://ppucndvetyzteyhwrarh.supabase.co; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), idle-detection=(), local-fonts=(), screen-wake-lock=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
