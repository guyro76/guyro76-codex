<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="אלבומיקס - דיזיין אלבומים מקצועיים בשנייה עם AI">
    <meta name="theme-color" content="#667eea">
    <title>אלבומיקס - עיצוב אלבומים פרימיום</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #667eea;
            --secondary: #00d4ff;
            --accent: #ff6b9d;
            --dark: #0f1419;
            --light: #f5f7ff;
            --text: #1a1a2e;
            --text-light: #718096;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, var(--light) 0%, #f8fbff 100%);
            color: var(--text);
            line-height: 1.6;
        }

        /* ============ NAVBAR ============ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e8ebf7;
            padding: 1rem 2rem;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.08);
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .logo-icon {
            font-size: 2rem;
        }

        /* ============ HERO ============ */
        .hero {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
            text-align: center;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .btn-primary {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            font-size: 1.2rem;
            margin-top: 2rem;
            color: var(--primary);
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(180deg, #0a0e27 0%, #1a1a3e 100%);
                color: #e0e0e0;
            }

            .navbar {
                background: rgba(15, 20, 25, 0.8);
                border-bottom-color: #2a2a4e;
            }

            .text-light {
                color: #a0a0c0;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <span class="logo-icon">🎨</span>
                <span>אלבומיקס AI</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>אלבומיקס AI</h1>
        <p>עיצוב אלבומים מקצועיים בשנייה עם כוח AI</p>

        <button class="btn-primary" id="redirectBtn">
            <span class="loading" style="display: none;"></span>
            <span id="btnText">💫 פתיחת האתר...</span>
        </button>

        <div class="message" id="message"></div>
    </section>

    <script>
        // Redirect to production HTML
        function redirectToApp() {
            const btn = document.getElementById('redirectBtn');
            const btnText = document.getElementById('btnText');
            const loading = btn.querySelector('.loading');

            // Show loading
            loading.style.display = 'inline-block';
            btnText.textContent = 'טוען את האתר...';
            btn.disabled = true;

            // Redirect after 1 second
            setTimeout(() => {
                window.location.href = 'index-production.html';
            }, 1000);
        }

        // Auto-redirect on load
        window.addEventListener('load', () => {
            setTimeout(redirectToApp, 500);
        });

        // Click handler
        document.getElementById('redirectBtn').addEventListener('click', redirectToApp);

        // Message
        const msg = document.getElementById('message');
        msg.textContent = '⏳ מפנה אותך לאתר הרשמי...';
    </script>
</body>
</html>
