name: Build Windows App

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LangFlipDesktop.csproj

      - name: Publish (self-contained, no .NET install needed)
        run: >
          dotnet publish LangFlipDesktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Add installer scripts to package
        shell: pwsh
        run: |
          Copy-Item Install-LangFlip.ps1 publish\
          Copy-Item Install-LangFlip.bat publish\

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath LangFlip-Desktop-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangFlip-Desktop-win-x64
          path: LangFlip-Desktop-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "קליקשפה LangFlip Desktop v1.1.1"
          body: |
            ## קליקשפה - LangFlip Desktop v1.1.1

            אפליקציית Windows לתיקון שפת מקלדת (עברית ↔ אנגלית), תרגום ושיפור ניסוח.

            ### 🆕 מה חדש בגרסה 1.1.0
            - תיקון בעיית "לא קורה כלום" — ההחלפה עובדת עכשיו מיידית
            - ברירת מחדל חדשה: החלפה מיידית במקום (כמו LangOver)
            - מופעלת רק פעם אחת (Single Instance)
            - תרגום ושיפור ניסוח בחינם — ללא צורך במפתח API
            - קובץ ההתקנה כלול ב-ZIP ומסיר גרסה קודמת אוטומטית

            ### 📥 התקנה
            1. הורידו את הקובץ `LangFlip-Desktop-win-x64.zip`
            2. חלצו את התיקייה (Extract All)
            3. הפעילו את `Install-LangFlip.bat` כמנהל (קליק ימני → הפעל כמנהל)
            4. זהו! לא צריך להתקין .NET — הכל כלול.

            ### 🧪 בדיקה מהירה
            - פתחו פנקס רשימות, הקלידו `akuo`, סמנו ולחצו **Ctrl+Alt+H** → הטקסט יוחלף ל`שלום` מיד

            ### ⌨️ קיצורי מקלדת
            - `Ctrl+Alt+H` — הפוך לעברית
            - `Ctrl+Alt+E` — הפוך לאנגלית
            - `Ctrl+Alt+T` — תרגום
            - `Ctrl+Alt+I` — שיפור ניסוח
            - `Ctrl+Alt+Space` — תפריט צף

            ---
            **© 2026 נבנה ותוכנן על ידי גיא רוזנברג — כל הזכויות שמורות**
          files: LangFlip-Desktop-win-x64.zip
