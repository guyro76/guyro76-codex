name: Trivia Squares - Public HTTP Smoke

# Read-only public access check. Does NOT deploy, modify protection,
# require credentials, or create paid infrastructure.
on:
  pull_request:
    paths:
      - '.github/workflows/trivia-public-http-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'trivia-squares/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivia-public-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public homepage without a login session
        shell: bash
        env:
          PUBLIC_URL: https://trivia-squares.vercel.app/
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --location --silent --show-error --max-time 15 \
              --output /tmp/trivia-public-homepage.html \
              --write-out '%{http_code}' "$PUBLIC_URL" || true)"
            echo "Attempt $attempt: public HTTP status: ${code:-network-error}"
            if [ "$code" = "200" ] && \
                grep -Eiq 'TRIVIA SQUARES|Trivia Squares|טריוויה ריבועים' /tmp/trivia-public-homepage.html && \
                ! grep -Eiq 'Authentication Required|Vercel Authentication' /tmp/trivia-public-homepage.html; then
              success=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 12; fi
          done
          if [ "$success" -ne 1 ]; then
            echo "::error::Public homepage could not be verified. READY is not public-access proof."
            exit 1
          fi
          echo "Public homepage returned HTTP 200 with expected game identity, without login."
