name: ארץ-עיר GO! — בדיקות ופריסה ל-GitHub Pages

on:
  push:
    branches: ['claude/eretz-ir-go-game-3kvtm3', main]
    paths: ['eretz-ir-go/**', '.github/workflows/eretz-ir-go-pages.yml']
  workflow_dispatch:

# הפריסה נעשית בדחיפה לענף gh-pages, ולכן נדרשת רק הרשאת כתיבה לתוכן.
# ה-GITHUB_TOKEN המובנה מספיק — אין צורך בשום סוד חיצוני.
permissions:
  contents: write

concurrency:
  group: eretz-ir-go-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eretz-ir-go/package-lock.json

      - name: התקנת תלויות
        working-directory: eretz-ir-go
        run: npm ci

      - name: בדיקת טיפוסים
        working-directory: eretz-ir-go
        run: npx tsc -b

      - name: בדיקות יחידה
        working-directory: eretz-ir-go
        run: npm test

      - name: יצירת אייקוני PWA
        working-directory: eretz-ir-go
        run: npm run icons

      - name: התקנת Chromium לבדיקות E2E
        working-directory: eretz-ir-go
        run: npx playwright install --with-deps chromium

      - name: בדיקות E2E — מסלול המשחק המלא
        working-directory: eretz-ir-go
        run: npm run build && npm run test:e2e

      - name: בנייה לפרודקשן (נתיב Pages)
        working-directory: eretz-ir-go
        # הנתיב הציבורי ב-Pages הוא /<repo>/ — נגזר אוטומטית משם המאגר
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - name: פריסה לענף gh-pages
        # רק מהענף הראשי של הפיתוח — כדי שענפי ניסוי לא ידרסו את האתר החי
        if: github.ref == 'refs/heads/claude/eretz-ir-go-game-3kvtm3' || github.ref == 'refs/heads/main'
        run: |
          cd eretz-ir-go/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "פריסה אוטומטית מ-${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "::notice::האתר עודכן — https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"
