name: ארץ-עיר GO! — בדיקות ופריסה ל-GitHub Pages

on:
  push:
    branches: ['claude/eretz-ir-go-game-3kvtm3', main]
    paths: ['eretz-ir-go/**', '.github/workflows/eretz-ir-go-pages.yml']
  workflow_dispatch:

# פורסים ל-Pages בדרך אחת בלבד: דחיפה לענף gh-pages.
#
# קודם היו כאן שתי דרכים במקביל — גם דחיפה לענף וגם פרסום רשמי דרך
# `deploy-pages`. הן סותרות זו את זו: מקור ה-Pages של המאגר יכול להיות
# או ענף או Actions, לא שניהם. המאגר מוגדר לשרת מהענף, ולכן ג'וב
# הפרסום נדחה על ידי סביבת github-pages עוד לפני שהתחיל — הוא נכשל
# תוך שתי שניות, בלי אף צעד, ב-**כל** ריצה על main (12 מתוך 12), וייצר
# מייל כישלון על כל דחיפה.
#
# `configure-pages` עם enablement לא הציל: הוא מדליק את Pages כשהוא
# כבוי, אבל לא מחליף מקור שכבר מוגדר — ולכן הוא הצליח בשקט בזמן
# שהפרסום המשיך להיכשל.
#
# הדרך שנשארה היא זו שעובדת בפועל. מי שירצה דווקא את המסלול הרשמי
# צריך קודם לשנות ב-Settings ← Pages את המקור ל-GitHub Actions.
# ה-GITHUB_TOKEN המובנה מספיק — אין צורך בשום סוד חיצוני.
permissions:
  contents: write

concurrency:
  group: eretz-ir-go-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eretz-ir-go/package-lock.json

      - name: התקנת תלויות
        working-directory: eretz-ir-go
        run: npm ci

      - name: בדיקת טיפוסים
        working-directory: eretz-ir-go
        run: npx tsc -b

      - name: בדיקות יחידה
        working-directory: eretz-ir-go
        run: npm test

      - name: יצירת אייקוני PWA
        working-directory: eretz-ir-go
        run: npm run icons

      - name: התקנת Chromium לבדיקות E2E
        working-directory: eretz-ir-go
        run: npx playwright install --with-deps chromium

      - name: בדיקות E2E — מסלול המשחק המלא
        working-directory: eretz-ir-go
        run: npm run build && npm run test:e2e

      - name: בנייה לפרודקשן (נתיב Pages)
        working-directory: eretz-ir-go
        # הנתיב הציבורי ב-Pages הוא /<repo>/ — נגזר אוטומטית משם המאגר
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      # Netlify מגיש את האתר משורש הדומיין, ולכן משתמשים בבנייה של שלב
      # ה-E2E (בלי BASE_PATH). הצעד רץ רק אם הוגדרו הסודות; בלעדיהם הוא
      # מדלג בשקט ולא מפיל את הריצה.
      - name: פריסה ל-Netlify
        if: github.ref == 'refs/heads/claude/eretz-ir-go-game-3kvtm3' || github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::מדלגים על Netlify — חסרים הסודות NETLIFY_AUTH_TOKEN ו-NETLIFY_SITE_ID"
            exit 0
          fi
          npx --yes netlify-cli@latest deploy \
            --dir=eretz-ir-go/dist \
            --site "$NETLIFY_SITE_ID" \
            --prod \
            --message "ארץ-עיר GO! מ-${GITHUB_SHA::7}"

      - name: פריסה לענף gh-pages
        # רק מהענף הראשי של הפיתוח — כדי שענפי ניסוי לא ידרסו את האתר החי
        if: github.ref == 'refs/heads/claude/eretz-ir-go-game-3kvtm3' || github.ref == 'refs/heads/main'
        run: |
          cd eretz-ir-go/dist
          touch .nojekyll
          # Vercel עוקב אחרי כל ענף במאגר, וגם gh-pages נכלל בזה — והענף
          # הזה מכיל רק תוצרי בנייה. לכן כל דחיפה שלו יצרה פריסה אדומה
          # ומייל "Failed preview deployment", בלי קשר למשחק עצמו.
          #
          # שני פרויקטים ב-Vercel עוקבים אחרי המאגר, ולכל אחד מהם
          # ספריית שורש אחרת — ולכן כל אחד קורא vercel.json אחר:
          #   • eretz-ir-go   → ספריית השורש "eretz-ir-go"
          #   • guyro76-codex → ספריית השורש של המאגר, framework=Next.js
          # ההצהרה שבמאגר עצמו לא עוזרת כאן, כי Vercel קורא את הקובץ
          # מתוך הענף שהוא פורס — וב-gh-pages יש רק את התוצר. לכן שני
          # העותקים נוצרים כאן, בתוך התוצר.
          #
          # בלי העותק בשורש, guyro76-codex ניגש לבנות את gh-pages כפרויקט
          # Next.js, לא מוצא את "next" ב-package.json, ונכשל ב-
          # "No Next.js version detected".
          printf '{ "git": { "deploymentEnabled": { "gh-pages": false } } }\n' \
            > vercel.json
          mkdir -p eretz-ir-go
          printf '{ "git": { "deploymentEnabled": { "gh-pages": false } } }\n' \
            > eretz-ir-go/vercel.json
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "פריסה אוטומטית מ-${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "::notice::הענף gh-pages עודכן. כדי שהאתר יהיה חי צריך שמקור Pages יהיה הענף gh-pages (Settings ← Pages ← Deploy from a branch), או שהעבודה תמוזג ל-main."
