name: ארץ-עיר GO! — בדיקות ופריסה ל-GitHub Pages

on:
  push:
    branches: ['claude/eretz-ir-go-game-3kvtm3', main]
    paths: ['eretz-ir-go/**', '.github/workflows/eretz-ir-go-pages.yml']
  workflow_dispatch:

# נדרש כדי לפרוס ל-Pages ללא סודות חיצוניים
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eretz-ir-go-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eretz-ir-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eretz-ir-go/package-lock.json

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקת טיפוסים
        run: npx tsc -b

      - name: בדיקות אוטומטיות
        run: npm test

      - name: יצירת אייקוני PWA
        run: npm run icons

      - name: התקנת Chromium לבדיקות E2E
        run: npx playwright install --with-deps chromium

      - name: בדיקות E2E — מסלול המשחק המלא
        # רצות מול הבנייה לשורש דומיין, לפני הבנייה לתת-נתיב של Pages
        run: npm run build && npm run test:e2e

      - name: בנייה לפרודקשן
        # הנתיב הציבורי ב-Pages הוא /<repo>/ — נגזר אוטומטית משם המאגר
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: eretz-ir-go/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # הפריסה תיכשל עד שיופעל Pages פעם אחת ב-Settings → Pages → Source: GitHub Actions.
    # אין סיבה לצבוע את כל ה-CI באדום בגלל הגדרה שממתינה לאישור — הבדיקות הן השער האמיתי.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: הסבר אם הפריסה לא בוצעה
        if: failure()
        run: |
          echo "::warning::הבנייה והבדיקות עברו, אך הפריסה מחכה להפעלת GitHub Pages."
          echo "להפעלה חד-פעמית: Settings → Pages → Build and deployment → Source: GitHub Actions"
          echo "אחרי זה כל דחיפה תפרוס אוטומטית ל-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
