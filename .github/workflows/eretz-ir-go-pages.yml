name: ארץ-עיר GO! — בדיקות ופריסה ל-GitHub Pages

on:
  push:
    branches: ['claude/eretz-ir-go-game-3kvtm3', main]
    paths: ['eretz-ir-go/**', '.github/workflows/eretz-ir-go-pages.yml']
  workflow_dispatch:

# פורסים בשתי דרכים במקביל כדי שהאתר יעלה בלי שאף אחד ייגע בהגדרות:
# 1. Pages רשמי דרך Actions — `configure-pages` עם enablement מדליק את
#    Pages בעצמו אם הוא כבוי, ומעביר אותו למצב Actions.
# 2. דחיפה לענף gh-pages — רשת ביטחון אם המאגר מוגדר לשרת מענף.
# ה-GITHUB_TOKEN המובנה מספיק לשתיהן — אין צורך בשום סוד חיצוני.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eretz-ir-go-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eretz-ir-go/package-lock.json

      - name: התקנת תלויות
        working-directory: eretz-ir-go
        run: npm ci

      - name: בדיקת טיפוסים
        working-directory: eretz-ir-go
        run: npx tsc -b

      - name: בדיקות יחידה
        working-directory: eretz-ir-go
        run: npm test

      - name: יצירת אייקוני PWA
        working-directory: eretz-ir-go
        run: npm run icons

      - name: התקנת Chromium לבדיקות E2E
        working-directory: eretz-ir-go
        run: npx playwright install --with-deps chromium

      - name: בדיקות E2E — מסלול המשחק המלא
        working-directory: eretz-ir-go
        run: npm run build && npm run test:e2e

      - name: בנייה לפרודקשן (נתיב Pages)
        working-directory: eretz-ir-go
        # הנתיב הציבורי ב-Pages הוא /<repo>/ — נגזר אוטומטית משם המאגר
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      # Netlify מגיש את האתר משורש הדומיין, ולכן משתמשים בבנייה של שלב
      # ה-E2E (בלי BASE_PATH). הצעד רץ רק אם הוגדרו הסודות; בלעדיהם הוא
      # מדלג בשקט ולא מפיל את הריצה.
      - name: פריסה ל-Netlify
        if: github.ref == 'refs/heads/claude/eretz-ir-go-game-3kvtm3' || github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::מדלגים על Netlify — חסרים הסודות NETLIFY_AUTH_TOKEN ו-NETLIFY_SITE_ID"
            exit 0
          fi
          npx --yes netlify-cli@latest deploy \
            --dir=eretz-ir-go/dist \
            --site "$NETLIFY_SITE_ID" \
            --prod \
            --message "ארץ-עיר GO! מ-${GITHUB_SHA::7}"

      # חייב לרוץ בג'וב בלי `environment`: שער הסביבה נבדק לפני שהג'וב
      # מתחיל, ולכן אי אפשר ליצור את הסביבה מתוך ג'וב שכפוף לה.
      - name: הפעלת GitHub Pages והעברתו למצב Actions
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: אריזת האתר כארטיפקט של Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: eretz-ir-go/dist

      - name: פריסה לענף gh-pages
        # רק מהענף הראשי של הפיתוח — כדי שענפי ניסוי לא ידרסו את האתר החי
        if: github.ref == 'refs/heads/claude/eretz-ir-go-game-3kvtm3' || github.ref == 'refs/heads/main'
        run: |
          cd eretz-ir-go/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "פריסה אוטומטית מ-${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "::notice::הענף gh-pages עודכן. כדי שהאתר יהיה חי צריך שמקור Pages יהיה הענף gh-pages (Settings ← Pages ← Deploy from a branch), או שהעבודה תמוזג ל-main."

  # פרסום רשמי ל-Pages. סביבת github-pages מוגבלת לענף הראשי, ולכן זה
  # רץ רק מ-main — הרצה מענף פיתוח נדחית מיד על ידי GitHub.
  publish-pages:
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    steps:
      - name: פרסום ל-GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@v4
